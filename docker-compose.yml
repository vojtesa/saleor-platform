services:
  api:
    image: ghcr.io/saleor/saleor:3.23
    ports:
      - 127.0.0.1:8000:8000
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - saleor-backend-tier
    stdin_open: true
    tty: true
    depends_on:
      - db
      - cache
      - jaeger
      - minio
    env_file:
      - common.env
      - backend.env
    environment:
      - DASHBOARD_URL=https://dashboard.local.a-green.cz
      - ALLOWED_HOSTS=localhost,127.0.0.1,api,api.local.a-green.cz
      - EMAIL_URL=${EMAIL_URL:-smtp://mailpit:1025}
    volumes:
      - saleor-media:/app/media

  dashboard:
    image: saleor-dashboard:local
    ports:
      - 127.0.0.1:9000:80
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LOCALE_CODE=CS
      - API_URL=https://api.local.a-green.cz/graphql/

  db:
    image: library/postgres:15-alpine
    ports:
      - 127.0.0.1:5432:5432
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - saleor-db:/var/lib/postgresql/data
      - ./replica_user.sql:/docker-entrypoint-initdb.d/replica_user.sql:ro,z
    environment:
      - POSTGRES_USER=saleor
      - POSTGRES_PASSWORD=saleor

  cache:
    image: valkey/valkey:8.1-alpine
    ports:
      - 127.0.0.1:6379:6379
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - saleor-cache:/data

  worker:
    image: ghcr.io/saleor/saleor:3.23
    command: /app/worker-entrypoint.sh
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - saleor-backend-tier
    env_file:
      - common.env
      - backend.env
    environment:
      - EMAIL_URL=${EMAIL_URL:-smtp://mailpit:1025}
    depends_on:
      - cache
      - mailpit
      - minio
    volumes:
      - ./worker-entrypoint.sh:/app/worker-entrypoint.sh:ro
      - ./promotion-watchdog.sh:/app/promotion-watchdog.sh:ro
      - saleor-media:/app/media

  jaeger:
    image: jaegertracing/jaeger
    ports:
      - 127.0.0.1:16686:16686
      - "4317:4317"
      - 127.0.0.1:4318:4318
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - type: tmpfs
        target: /tmp

  mailpit:
    image: axllent/mailpit
    ports:
      - 127.0.0.1:1025:1025 # smtp server
      - 127.0.0.1:8025:8025 # web ui. Visit http://localhost:8025/ to check emails
    restart: unless-stopped
    networks:
      - saleor-backend-tier

  dynamodb:
    image: amazon/dynamodb-local:latest
    ports:
      - 127.0.0.1:8005:8000
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    command: "-jar DynamoDBLocal.jar -sharedDb"
    volumes:
      - saleor-dynamodb:/home/dynamodblocal/data

  gorse:
    image: zhenghaoz/gorse-in-one:latest
    ports:
      - 127.0.0.1:8088:8088
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - gorse-data:/gorse_data
      - ./gorse-config.toml:/etc/gorse/config.toml
    environment:
      GORSE_CACHE_STORE: postgres://saleor:saleor@db:5432/gorse?sslmode=disable
      GORSE_DATA_STORE: postgres://saleor:saleor@db:5432/gorse?sslmode=disable
    depends_on:
      - db

  typesense:
    image: typesense/typesense:27.1
    ports:
      - 127.0.0.1:8108:8108
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - typesense-data:/data
    command: "--data-dir /data --api-key=xyz --enable-cors"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - 127.0.0.1:9002:9000   # S3 API (host:9002 -> container:9000)
      - 127.0.0.1:9003:9001   # Console UI (host:9003 -> container:9001)
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: b8v+9Jy7Jn5bE9CY+TfJQfiHuq1fh5ZsAxP1Afi7G44=

  listmonk:
    image: listmonk/listmonk:latest
    ports:
      - 127.0.0.1:9001:9000
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    depends_on:
      - db
    volumes:
      - ./listmonk/config.toml:/listmonk/config.toml:ro
    environment:
      - LISTMONK_app__admin_username=admin
      - LISTMONK_app__admin_password=admin

  comgate:
    build:
      context: ../deploy_a-green
      dockerfile: Dockerfile.comgate
    ports:
      - 127.0.0.1:3003:3003
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - saleor-backend-tier
    volumes:
      - ../deploy_a-green/comgate-app/data:/data
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - PORT=3003
      - APL_FILE_PATH=/data/comgate-apl.json
      - APP_BASE_URL=http://host.docker.internal:3003
      - APP_BROWSER_URL=http://localhost:3003
      - SALEOR_API_URL=${SALEOR_API_URL:-http://api:8000/graphql/}
      - SYNC_WEBHOOK_URL=${SYNC_WEBHOOK_URL:-http://workflow-service:3001/api/webhooks}
      - SECRET_KEY=${COMGATE_SECRET_KEY:-72416311dad0aab4bba64ed08becc59203de836ab38f1e26be5342024f38218e}
      - COMGATE_MERCHANT=${COMGATE_MERCHANT:-516241}
      - COMGATE_SECRET=${COMGATE_SECRET:-Ktf6atp4EEcRjqttHDJFiplGusjJJ2LG}
      - COMGATE_TEST=${COMGATE_TEST:-1}
      - APP_ID=cz.vojtesa.comgate-local

  workflow-service:
    build:
      context: ../custom-services
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:3002:3001
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - workflow-data:/data
      - ../custom-services/src/modules/invoices:/app/templates
    environment:
      - PORT=3001
      - DATABASE_PATH=/data/workflow.db
      - API_KEY=${WORKFLOW_API_KEY:-workflow-dev-key-change-in-production}
      - CORS_ORIGIN=http://localhost:3000
      - APP_BASE_URL=https://workflow.local.a-green.cz
      - APP_API_BASE_URL=http://host.docker.internal:3002
      - APP_ID=cz.vojtesa.workflow
      - APP_NAME=Rezervace + workflow objednavek
      - FIO_API_TOKEN=${FIO_API_TOKEN:-}
      - FIO_POLL_INTERVAL_S=${FIO_POLL_INTERVAL_S:-30}
      - FIO_ALERT_EMAIL=${FIO_ALERT_EMAIL:-fakturace@a-green.cz}
      - SMTP_HOST=${WORKFLOW_SMTP_HOST:-smtp.seznam.cz}
      - SMTP_PORT=${WORKFLOW_SMTP_PORT:-465}
      - SMTP_SECURE=${WORKFLOW_SMTP_SECURE:-true}
      - SMTP_USER=${WORKFLOW_SMTP_USER:-noreply@a-green.cz}
      - SMTP_PASS=${WORKFLOW_SMTP_PASS:-kekSi0-pofmoz-poghok}
      - EMAIL_FROM=${WORKFLOW_EMAIL_FROM:-noreply@a-green.cz}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-eshop@a-green.cz}
      - SALEOR_DASHBOARD_URL=${SALEOR_DASHBOARD_URL:-http://localhost:9000}
      - STOREFRONT_URL=${STOREFRONT_URL:-http://localhost:3000}
      - LISTMONK_URL=${LISTMONK_URL:-http://listmonk:9000/api}
      - LISTMONK_USER=${LISTMONK_USER:-admin_api}
      - LISTMONK_TOKEN=${LISTMONK_TOKEN:-a-green-dev-token-2026}
      - EMAIL_WEBHOOK_SECRET=${EMAIL_WEBHOOK_SECRET:-}
      - PICKUP_ADDRESS=${PICKUP_ADDRESS:-A-green s.r.o., Bubeníčkova 4368/9, 615 00 Brno}
      - PAYMENT_BANK_ACCOUNT=${PAYMENT_BANK_ACCOUNT:-}

volumes:
  minio-data:
  saleor-media:
  workflow-data:
  gorse-data:
  typesense-data:
  saleor-db:
    driver: local
  saleor-cache:
    driver: local
  saleor-dynamodb:
  comgate-data:

networks:
  saleor-backend-tier:
    driver: bridge
